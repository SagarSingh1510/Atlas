services:
  postgres:
    image: postgres:17
    container_name: atlas-postgres

    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: admin12341

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  workspace-postgres:
    image: postgres:17
    container_name: atlas-workspace-postgres
    environment:
      POSTGRES_DB: atlas_workspace
      POSTGRES_USER: atlas_workspace
      POSTGRES_PASSWORD: admin1121
    ports:
      - "5433:5432"
    volumes:
      - workspace-postgres-data:/var/lib/postgresql/data

  task-postgres:
    image: postgres:17
    container_name: atlas-task-postgres
    environment:
      POSTGRES_DB: atlas_task
      POSTGRES_USER: atlas_task
      POSTGRES_PASSWORD: admin12341
    ports:
      - "5434:5432"
    volumes:
      - task-postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  workspace-postgres-data:
  task-postgres-data: