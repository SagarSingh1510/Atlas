spring.config.import=optional:file:../../.env[.properties]

spring.application.name=api-gateway
server.port=8079

atlas.gateway.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8080}
atlas.gateway.workspace-service-url=${WORKSPACE_SERVICE_URL:http://localhost:8081}
atlas.gateway.task-service-url=${TASK_SERVICE_URL:http://localhost:8082}
atlas.gateway.diagram-service-url=${DIAGRAM_SERVICE_URL:http://localhost:8083}
atlas.gateway.deployment-service-url=${DEPLOYMENT_SERVICE_URL:http://localhost:8084}
atlas.gateway.simulation-service-url=${SIMULATION_SERVICE_URL:http://localhost:8085}
atlas.gateway.ai-review-service-url=${AI_REVIEW_SERVICE_URL:http://localhost:8086}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
atlas.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
