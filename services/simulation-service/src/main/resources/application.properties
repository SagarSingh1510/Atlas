spring.config.import=optional:file:../../.env[.properties]

spring.application.name=simulation-service
server.port=8085

spring.datasource.url=${ATLAS_SIMULATION_DB_URL:jdbc:postgresql://127.0.0.1:5437/${ATLAS_SIMULATION_DB_NAME}}
spring.datasource.username=${ATLAS_SIMULATION_DB_USER}
spring.datasource.password=${ATLAS_SIMULATION_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${ATLAS_JWT_SECRET}
