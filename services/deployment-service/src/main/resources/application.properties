spring.config.import=optional:file:../../.env[.properties]

spring.application.name=deployment-service
server.port=8084

spring.datasource.url=${ATLAS_DEPLOYMENT_DB_URL:jdbc:postgresql://127.0.0.1:5436/${ATLAS_DEPLOYMENT_DB_NAME}}
spring.datasource.username=${ATLAS_DEPLOYMENT_DB_USER}
spring.datasource.password=${ATLAS_DEPLOYMENT_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${ATLAS_JWT_SECRET}
simulation-service.url=${SIMULATION_SERVICE_URL:http://localhost:8085}
ai-review-service.url=${AI_REVIEW_SERVICE_URL:http://localhost:8086}
