spring.config.import=optional:file:../../.env[.properties]

spring.application.name=task-service

server.port=8082

spring.datasource.url=${ATLAS_TASK_DB_URL:jdbc:postgresql://127.0.0.1:5434/${ATLAS_TASK_DB_NAME}}
spring.datasource.username=${ATLAS_TASK_DB_USER}
spring.datasource.password=${ATLAS_TASK_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${ATLAS_JWT_SECRET}

workspace-service.url=${WORKSPACE_SERVICE_URL:http://localhost:8081}
