spring.config.import=optional:file:../../.env[.properties]

spring.application.name=diagram-service
server.port=8083

spring.datasource.url=${ATLAS_DIAGRAM_DB_URL:jdbc:postgresql://127.0.0.1:5435/${ATLAS_DIAGRAM_DB_NAME}}
spring.datasource.username=${ATLAS_DIAGRAM_DB_USER}
spring.datasource.password=${ATLAS_DIAGRAM_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${ATLAS_JWT_SECRET}
auth-service.url=${AUTH_SERVICE_URL:http://localhost:8080}
workspace-service.url=${WORKSPACE_SERVICE_URL:http://localhost:8081}
deployment-service.url=${DEPLOYMENT_SERVICE_URL:http://localhost:8084}
