spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=${ATLAS_AUTH_DB_URL:jdbc:postgresql://127.0.0.1:5432/${ATLAS_AUTH_DB_NAME}}
spring.datasource.username=${ATLAS_AUTH_DB_USER}
spring.datasource.password=${ATLAS_AUTH_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${ATLAS_JWT_SECRET}
