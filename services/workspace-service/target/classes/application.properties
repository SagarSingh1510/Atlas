spring.config.import=optional:file:../../.env[.properties]

server.port=8081

spring.datasource.url=${ATLAS_WORKSPACE_DB_URL:jdbc:postgresql://127.0.0.1:5433/${ATLAS_WORKSPACE_DB_NAME}}
spring.datasource.username=${ATLAS_WORKSPACE_DB_USER}
spring.datasource.password=${ATLAS_WORKSPACE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${ATLAS_JWT_SECRET}

auth-service.url=${AUTH_SERVICE_URL:http://localhost:8080}
