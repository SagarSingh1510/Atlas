spring.config.import=optional:file:../../.env[.properties]

spring.application.name=ai-review-service
server.port=8086

spring.datasource.url=${ATLAS_AI_REVIEW_DB_URL:jdbc:postgresql://127.0.0.1:5438/${ATLAS_AI_REVIEW_DB_NAME}}
spring.datasource.username=${ATLAS_AI_REVIEW_DB_USER}
spring.datasource.password=${ATLAS_AI_REVIEW_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${ATLAS_JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.atlas.events
spring.kafka.consumer.auto-offset-reset=earliest
atlas.kafka.topics.simulation-completed=atlas.simulation.completed.v1
