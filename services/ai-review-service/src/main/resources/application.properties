spring.config.import=optional:file:../../.env[.properties]

spring.application.name=ai-review-service
server.port=8086

spring.datasource.url=${ATLAS_AI_REVIEW_DB_URL:jdbc:postgresql://127.0.0.1:5438/${ATLAS_AI_REVIEW_DB_NAME}}
spring.datasource.username=${ATLAS_AI_REVIEW_DB_USER}
spring.datasource.password=${ATLAS_AI_REVIEW_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${ATLAS_JWT_SECRET}
